problem_name: mkp_aco
problem_type: aco
obj_type: max
problem_size: 100
behavior:
  problem_size: 100
  dataset: problems/mkp_aco/dataset/train100_dataset.npz
  matrices: 5
  stage_ratios:
  - 0.2
  - 0.5
  - 0.8
  probes_per_stage: 4
  seed: ${seed}
  batch_size: 32
  heuristic_timeout: 0.5
  encode_timeout: 5
  feature_group: mean
operators:
  expand_parent_counts:
  - 1
  - 2
  explore_parent_counts:
  - 1
  - 2
func_name: heuristics
description: Solving Multiple Knapsack Problems (MKP) through stochastic solution
  sampling based on "heuristics". MKP involves selecting a subset of items to maximize
  the total prize collected, subject to multi-dimensional maximum weight constraints.
